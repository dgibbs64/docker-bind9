name: Docker Publish
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - .github/workflows/action-docker-publish.yml
  schedule:
    - cron: "0 4 * * *"

permissions: {}

jobs:
  check:
    name: Check for new BIND release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Get latest BIND version from packages.sury.org
        id: version
        run: |
          version="$(curl -fsSL https://packages.sury.org/bind/dists/trixie/main/binary-amd64/Packages \
            | awk '/^Package: bind9$/{f=1} f&&/^Version:/{print $2; exit}' \
            | sed -E 's/^[0-9]+://; s/-.*//')"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not determine BIND version (got '${version}')" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "minor=${version%.*}" >> "${GITHUB_OUTPUT}"
          echo "Latest BIND: ${version}"

      - name: Decide whether to build
        id: decide
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          # Scheduled runs build when a new BIND version is out, and every
          # Saturday regardless to pick up Debian base image security updates.
          if [[ "${EVENT}" != "schedule" ]]; then
            build=true
          elif ! docker buildx imagetools inspect "ghcr.io/dgibbs64/bind9:${VERSION}" > /dev/null 2>&1; then
            build=true
          elif [[ "$(date -u +%u)" == "6" ]]; then
            build=true
          else
            build=false
          fi
          echo "build=${build}" >> "${GITHUB_OUTPUT}"
          echo "Build: ${build}"

  build:
    name: Build BIND ${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build for testing (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: bind9:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          docker run -d --name bind9-test bind9:test -g -4
          for _ in $(seq 1 30); do
            [[ "$(docker inspect -f '{{.State.Health.Status}}' bind9-test)" == "healthy" ]] && break
            sleep 2
          done
          docker logs bind9-test 2>&1 | grep -v "built with"
          [[ "$(docker inspect -f '{{.State.Health.Status}}' bind9-test)" == "healthy" ]]
          [[ "$(docker exec bind9-test cat /etc/bind9-version)" == "${VERSION}" ]]
          docker exec bind9-test dig +time=5 +tries=2 @127.0.0.1 example.com | grep -q "status: NOERROR"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            dgibbs64/bind9
            ghcr.io/dgibbs64/bind9
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check.outputs.version }}
            type=raw,value=${{ needs.check.outputs.minor }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  package-cleanup:
    name: Cleanup Old GitHub Packages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete Package Versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: bind9
          package-type: container
          min-versions-to-keep: 1
          delete-only-untagged-versions: true
